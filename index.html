<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Dreamer: Gemini + MediaPipe + Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        
        /* UI Overlay */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            max-width: 300px;
            box-shadow: 0 0 20px rgba(0,255,255,0.1);
        }

        h1 { margin: 0 0 10px 0; font-size: 1.2rem; background: linear-gradient(90deg, #00ffff, #ff00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { font-size: 0.85rem; color: #ccc; margin-bottom: 15px; }
        
        input, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background: #0066cc;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #0088ff; }
        button:disabled { background: #444; cursor: not-allowed; }

        .status { font-size: 0.75rem; color: #aaa; margin-top: 5px; }

        /* Webcam Preview */
        #cam-preview {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            background: #111;
            border: 2px solid #333;
            border-radius: 8px;
            z-index: 100;
            overflow: hidden;
            transform: scaleX(-1); /* Mirror effect */
        }
        #video-feed { width: 100%; height: 100%; object-fit: cover; }
        #cam-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* Gesture Indicator */
        #gesture-box {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            pointer-events: none;
            transform: scaleX(-1); /* Un-mirror text inside mirrored container */
        }
    </style>
    
    <!-- Import Maps -->
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "@google/generative-ai": "https://esm.run/@google/generative-ai"
          }
        }
    </script>

    <!-- MediaPipe Globals -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- UI -->
    <div id="ui-container">
        <h1>Cosmic Dreamer</h1>
        <p>Combine Hand Gestures with Generative AI.</p>
        
        <input type="password" id="api-key" placeholder="Enter Gemini API Key" />
        <input type="text" id="prompt-input" placeholder="e.g. Exploding Star, DNA Helix" />
        <button id="generate-btn">Dream It</button>
        
        <div class="status" id="status-msg">Ready.</div>
        <hr style="border-color:#333; margin:15px 0;">
        <p style="margin:0; font-size:0.8rem;">
            <b>👋 Open:</b> Scatter/Idle<br>
            <b>✊ Fist:</b> Gravity Well<br>
            <b>🤏 Pinch:</b> Swirl/Orbit
        </p>
    </div>

    <!-- Webcam -->
    <div id="cam-preview">
        <video id="video-feed" playsinline></video>
        <canvas id="cam-overlay"></canvas>
        <div id="gesture-box">Detecting...</div>
    </div>

    <!-- Application Script -->
    <script type="module">
        import * as THREE from 'three';
        import { GoogleGenerativeAI } from "@google/generative-ai";

        // --- Configuration ---
        const PARTICLE_COUNT = 30000;
        const CAM_WIDTH = 320;
        const CAM_HEIGHT = 240;
        
        // --- State ---
        let handPosition = new THREE.Vector3(0, 0, 0); // Normalized -1 to 1
        let isHandDetected = false;
        let currentGesture = 'OPEN'; // OPEN, FIST, PINCH
        let isGenerating = false;

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- Particle System ---
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3); // Where particles "want" to be
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        const velocities = new Float32Array(PARTICLE_COUNT * 3);

        // Initialize Sphere
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const r = 5 * Math.cbrt(Math.random());
            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos(2 * Math.random() - 1);
            
            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);

            const i3 = i * 3;
            positions[i3] = x; positions[i3+1] = y; positions[i3+2] = z;
            targetPositions[i3] = x; targetPositions[i3+1] = y; targetPositions[i3+2] = z;
            
            colors[i3] = 0.5 + x/10; colors[i3+1] = 0.5 + y/10; colors[i3+2] = 1.0;
            velocities[i3] = 0; velocities[i3+1] = 0; velocities[i3+2] = 0;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.8
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // --- Logic Engine (The "Brain") ---
        
        // 1. Gemini Integration
        async function generateShape(prompt) {
            const apiKey = document.getElementById('api-key').value;
            if (!apiKey) { alert("Please enter a Gemini API Key"); return; }
            
            const status = document.getElementById('status-msg');
            status.textContent = "Dreaming...";
            status.style.color = "#ffff00";
            isGenerating = true;

            try {
                const genAI = new GoogleGenerativeAI(apiKey);
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

                // We ask Gemini to write a JS function to calculate coordinates. 
                // This is much faster/efficient than asking it to return 30,000 JSON points.
                const systemPrompt = `
                    You are a mathematical artist. 
                    Write a JavaScript function body that calculates x, y, z, r, g, b for a single particle.
                    The function signature is implicit: (i, total) => { ... return {x,y,z, r,g,b} }
                    
                    Input variables provided: 
                    - i: current particle index (0 to total-1)
                    - total: total number of particles
                    
                    Output: A javascript object { x, y, z, r, g, b }
                    - Coordinates (x,y,z) should be roughly within -8 to 8.
                    - Colors (r,g,b) should be 0.0 to 1.0.
                    
                    Task: Create the shape/concept: "${prompt}".
                    
                    Return ONLY the code inside the function body. No markdown, no 'function' keyword.
                    Use Math.sin, Math.cos, Math.random(), etc.
                `;

                const result = await model.generateContent(systemPrompt);
                const response = await result.response;
                const codeBody = response.text().replace(/```javascript|```/g, '').trim();

                // Create the function from the string
                const particleFunc = new Function('i', 'total', codeBody);

                // Update Targets
                const posAttr = geometry.attributes.position.array;
                const colAttr = geometry.attributes.color.array;

                for(let i=0; i<PARTICLE_COUNT; i++) {
                    try {
                        const p = particleFunc(i, PARTICLE_COUNT);
                        const i3 = i*3;
                        targetPositions[i3] = p.x || 0;
                        targetPositions[i3+1] = p.y || 0;
                        targetPositions[i3+2] = p.z || 0;
                        
                        colAttr[i3] = p.r || 1;
                        colAttr[i3+1] = p.g || 1;
                        colAttr[i3+2] = p.b || 1;
                    } catch(e) {
                        // Fallback if generated code is buggy for specific index
                        continue; 
                    }
                }
                
                geometry.attributes.color.needsUpdate = true;
                status.textContent = "Dream realized.";
                status.style.color = "#00ff00";

            } catch (error) {
                console.error(error);
                status.textContent = "Nightmare error (Check Console/API Key)";
                status.style.color = "#ff0000";
            }
            isGenerating = false;
        }

        document.getElementById('generate-btn').addEventListener('click', () => {
            const prompt = document.getElementById('prompt-input').value;
            if(prompt) generateShape(prompt);
        });

        // 2. MediaPipe Integration
        const videoElement = document.getElementById('video-feed');
        const canvasElement = document.getElementById('cam-overlay');
        const canvasCtx = canvasElement.getContext('2d');
        const gestureBox = document.getElementById('gesture-box');

        // Initialize Canvas size
        canvasElement.width = CAM_WIDTH;
        canvasElement.height = CAM_HEIGHT;

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // Draw skeleton on preview
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandDetected = true;
                const landmarks = results.multiHandLandmarks[0];

                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1, radius: 2});

                // --- Gesture Recognition Math ---
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const midTip = landmarks[12];
                const wrist = landmarks[0];

                // Map hand position to 3D world (normalize -1 to 1)
                // Note: MediaPipe x is 0-1 (left-right). In ThreeJS, x is neg-pos.
                // We flip X because webcam is mirrored logic.
                const ndcX = (1.0 - landmarks[9].x) * 2 - 1; 
                const ndcY = -(landmarks[9].y * 2 - 1); // Invert Y
                
                // Smooth interpolation for hand movement
                handPosition.lerp(new THREE.Vector3(ndcX * 10, ndcY * 8, 0), 0.1);

                // Distance calculations
                const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
                const fingersExtended = [8, 12, 16, 20].map(idx => {
                    return Math.hypot(landmarks[idx].x - wrist.x, landmarks[idx].y - wrist.y);
                });
                
                // Simple heuristic logic
                if (pinchDist < 0.05) {
                    currentGesture = 'PINCH';
                    gestureBox.innerText = "🤏 Swirl";
                    gestureBox.style.color = "#ffff00";
                } else if (fingersExtended.every(d => d < 0.3)) { // Very rough "fist" metric
                    currentGesture = 'FIST';
                    gestureBox.innerText = "✊ Black Hole";
                    gestureBox.style.color = "#ff0000";
                } else {
                    currentGesture = 'OPEN';
                    gestureBox.innerText = "👋 Hover";
                    gestureBox.style.color = "#00ff00";
                }

            } else {
                isHandDetected = false;
                gestureBox.innerText = "No Hand";
                gestureBox.style.color = "#aaa";
            }
            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: CAM_WIDTH,
            height: CAM_HEIGHT
        });
        cameraUtils.start();


        // --- Animation Loop ---
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);
            const positionsAttr = geometry.attributes.position;
            const arr = positionsAttr.array;

            // Physics Update
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                let px = arr[i3];
                let py = arr[i3 + 1];
                let pz = arr[i3 + 2];

                let tx = targetPositions[i3];
                let ty = targetPositions[i3 + 1];
                let tz = targetPositions[i3 + 2];

                let vx = velocities[i3];
                let vy = velocities[i3 + 1];
                let vz = velocities[i3 + 2];

                // 1. Seek Target (Base Shape)
                // Spring force towards the Gemini-defined target
                const ax = (tx - px) * 2.0; 
                const ay = (ty - py) * 2.0;
                const az = (tz - pz) * 2.0;

                vx += ax * dt;
                vy += ay * dt;
                vz += az * dt;

                // 2. Hand Interaction
                if (isHandDetected) {
                    const dx = px - handPosition.x;
                    const dy = py - handPosition.y;
                    const dz = pz - handPosition.z;
                    const distSq = dx*dx + dy*dy + dz*dz + 0.1;
                    const dist = Math.sqrt(distSq);

                    if (currentGesture === 'FIST') {
                        // Strong Attraction (Black Hole)
                        if (dist < 8) {
                            const force = 150 / distSq;
                            vx -= (dx / dist) * force * dt;
                            vy -= (dy / dist) * force * dt;
                            vz -= (dz / dist) * force * dt;
                        }
                    } else if (currentGesture === 'PINCH') {
                        // Swirl / Vortex
                        if (dist < 6) {
                            // Tangent force for rotation
                            vx += -dy * 5 * dt;
                            vy += dx * 5 * dt;
                            // Slight attraction to keep them contained
                            vx -= (dx / dist) * 2 * dt;
                            vy -= (dy / dist) * 2 * dt;
                            vz -= (dz / dist) * 2 * dt;
                        }
                    } else {
                        // OPEN Hand: Repulsion (Push away)
                        if (dist < 4) {
                            const force = 20 / distSq;
                            vx += (dx / dist) * force * dt;
                            vy += (dy / dist) * force * dt;
                            vz += (dz / dist) * force * dt;
                        }
                    }
                }

                // Damping (Friction)
                vx *= 0.92;
                vy *= 0.92;
                vz *= 0.92;

                // Update Position
                px += vx * dt;
                py += vy * dt;
                pz += vz * dt;

                arr[i3] = px;
                arr[i3+1] = py;
                arr[i3+2] = pz;
                
                velocities[i3] = vx;
                velocities[i3+1] = vy;
                velocities[i3+2] = vz;
            }

            positionsAttr.needsUpdate = true;
            
            // Idle rotation
            if(!isHandDetected) {
                particleSystem.rotation.y += 0.002;
            }

            renderer.render(scene, camera);
        }

        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
